  <h1>shoprite-staples</h1>
  <p>A personal tool, used only by its owner, that reads the owner's own ShopRite pickup
  order emails to work out which groceries are bought every order, and checks the weekly
  ad for sales on those items.</p>
  <p>It is not a public service and does not accept other users.</p>
